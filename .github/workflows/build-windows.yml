name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Download FFmpeg and Tesseract for bundling
        shell: pwsh
        run: ./scripts/download_tools.ps1
      - name: Build standalone executable
        run: python build.py
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test executable package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/HeadlineHighlighter.exe)) { throw 'Executable was not produced.' }
          Get-Item dist/HeadlineHighlighter.exe | Format-List Name,Length
      - name: Upload Headline Highlighter
        uses: actions/upload-artifact@v4
        with:
          name: HeadlineHighlighter-windows
          path: dist/HeadlineHighlighter.exe
          if-no-files-found: error
